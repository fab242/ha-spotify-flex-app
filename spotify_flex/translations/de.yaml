configuration:
  device_name:
    name: Gerätename
    description: Unter diesem Namen erscheint der Empfänger bei Spotify.
  client_id:
    name: Client-ID
    description: Client-ID deiner App aus dem Spotify-Entwickler-Dashboard (für Bibliothek, Playlists und Suche). Kein Secret nötig.
  bitrate:
    name: Bitrate
    description: Streaming-Qualität in kbit/s.
  normalisation:
    name: Lautstärke angleichen
    description: Gleicht laute und leise Titel an (Spotify-Normalisierung).
  zeroconf:
    name: Im Netzwerk sichtbar
    description: Zusätzlich per Zeroconf in der Spotify-App im WLAN anbieten.
  log_level:
    name: Protokollstufe
  ha_integration:
    name: Home-Assistant-Player
    description: Installiert die Integration „Spotify Flex Player“ (Player, Lautsprecher, Gruppen als Entitäten für Kacheln und Automationen).
  lyrics_aligner_url:
    name: Liedtext-Analyse (Adresse)
    description: Adresse des Containers flex-lyrics-aligner im Heimnetz, z. B. http://192.168.0.20:8770. Dann sitzen Zeilen und springender Punkt exakt auf dem Gesang. Leer = aus.
  lyrics_aligner_token:
    name: Liedtext-Analyse (Token)
    description: Nur nötig, wenn im Container ALIGNER_TOKEN gesetzt ist.

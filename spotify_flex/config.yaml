name: Spotify Flex
version: "1.0.6"
slug: spotify_flex
description: Eigenständiger Spotify-Player mit Connect-Empfänger und AirPlay-Ausgabe an HomePods
url: https://github.com/fab242/ha-spotify-flex-app
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:spotify
panel_title: Spotify
map:
  - type: addon_config
    read_only: false
options:
  device_name: Home Flex
  client_id: ""
  bitrate: 320
  normalisation: true
  zeroconf: false
  log_level: info
schema:
  device_name: str
  client_id: str?
  bitrate: list(96|160|320)
  normalisation: bool
  zeroconf: bool
  log_level: list(trace|debug|info|warn|error)

search:
  fields:
    query:
      required: true
      example: "Delerium"
      selector:
        text:
    types:
      example: ["track", "album"]
      selector:
        select:
          multiple: true
          options: [track, artist, album, playlist, show, episode, audiobook]
queue:
browse:
  fields:
    node:
      example: "flex:node:shows@0"
      selector:
        text:
    offset:
      default: 0
      selector:
        number:
          min: 0
          max: 100000
          mode: box
add_to_queue:
  fields:
    uri:
      required: true
      example: "spotify:track:4uLU6hMCjMI75M1A2tKUQC"
      selector:
        text:
like:
  fields:
    action:
      default: status
      selector:
        select:
          options: [status, save, remove, toggle]
    uri:
      example: "spotify:track:4uLU6hMCjMI75M1A2tKUQC"
      selector:
        text:
sleep_timer:
  fields:
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: min
equalizer:
  fields:
    enabled:
      selector:
        boolean:
    preset:
      example: "rock"
      selector:
        select:
          options: [flat, acoustic, bass_boost, bass_cut, classical, dance, deep, electronic, hiphop, jazz, latin, loudness, lounge, piano, pop, rnb, rock, small_speakers, spoken, treble_boost, treble_cut, vocal]
    gains:
      example: "[3, 2, 0, 0, 1, 2]"
      selector:
        object:
announce:
  fields:
    media:
      required: true
      example: '[{"media_content_id": "media-source://tts/tts.piper?message=Hallo", "volume": 35}]'
      selector:
        object:
    group:
      example: "Wohnzimmer"
      selector:
        text:
    wait:
      default: true
      selector:
        boolean:
    timeout:
      default: 900
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
stop_announcement:

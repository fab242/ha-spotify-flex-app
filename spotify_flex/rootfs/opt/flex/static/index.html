<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotify Flex – Einstellungen</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="title">
      <h1>Spotify Flex</h1>
      <span class="sub" id="version">Einstellungen</span>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="accounts">Konten</button>
    <button role="tab" data-tab="speakers">Lautsprecher</button>
    <button role="tab" data-tab="groups">Gruppen</button>
    <button role="tab" data-tab="system">System</button>
  </nav>

  <main id="view" class="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="static/app.js"></script>
</body>
</html>

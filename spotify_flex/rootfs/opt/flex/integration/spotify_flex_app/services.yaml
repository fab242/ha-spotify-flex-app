search:
  fields:
    query:
      required: true
      example: "Delerium"
      selector:
        text:
    types:
      example: ["track", "album"]
      selector:
        select:
          multiple: true
          options: [track, artist, album, playlist, show, episode, audiobook]
queue:
add_to_queue:
  fields:
    uri:
      required: true
      example: "spotify:track:4uLU6hMCjMI75M1A2tKUQC"
      selector:
        text:
like:
  fields:
    action:
      default: status
      selector:
        select:
          options: [status, save, remove, toggle]
    uri:
      example: "spotify:track:4uLU6hMCjMI75M1A2tKUQC"
      selector:
        text:
sleep_timer:
  fields:
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: min
equalizer:
  fields:
    enabled:
      selector:
        boolean:
    preset:
      example: "rock"
      selector:
        select:
          options: [flat, acoustic, bass_boost, bass_cut, classical, dance, deep, electronic, hiphop, jazz, latin, loudness, lounge, piano, pop, rnb, rock, small_speakers, spoken, treble_boost, treble_cut, vocal]
    gains:
      example: "[3, 2, 0, 0, 1, 2]"
      selector:
        object:
